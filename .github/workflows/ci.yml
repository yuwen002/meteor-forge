name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          go test ./... -count=1 -cover -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out


  driver-integration:
    name: Database Driver Integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meteor_forge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meteor_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d meteor_forge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd="clickhouse-client --user default --password clickhouse --query 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run database driver integration tests
        env:
          METEOR_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/meteor_forge_test?parseTime=true"
          METEOR_TEST_POSTGRES_DSN: "postgres://postgres:postgres@127.0.0.1:5432/meteor_forge_test?sslmode=disable"
          METEOR_TEST_CLICKHOUSE_DSN: "clickhouse://default:clickhouse@127.0.0.1:9000/default?dial_timeout=5s&read_timeout=10s"
        run: go test -tags=integration ./pkg/driver/integration -count=1 -v

  web-admin:
    name: Web Admin (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and build
        run: npm run build

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install golangci-lint with the configured Go toolchain
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m
