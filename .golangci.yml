run:
  timeout: 3m
  tests: false

linters:
  enable:
    - govet
    - errcheck
    - unused
    - gosimple
    - staticcheck
    - ineffassign
    - typecheck
    - misspell
    - prealloc
  disable:
    - exhaustruct

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  misspell:
    locale: US
  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec